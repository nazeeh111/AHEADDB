[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aheaddb"
version = "0.2.0"
description = "Local relational predictions with correctness-first maintained views"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{name = "Nazeeh Abdul-Hadi"}]
dependencies = ["duckdb==1.4.1", "pandas==2.3.3", "numpy==2.3.4", "scikit-learn==1.7.2", "pydantic==2.12.3", "fastapi==0.119.1", "uvicorn==0.38.0", "typer==0.20.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "hypothesis==6.142.4", "httpx==0.28.1", "ruff==0.14.2", "build==1.3.0", "mypy==1.18.2", "pandas-stubs==2.3.2.250926"]
mcp = ["mcp==1.18.0"]
postgres = ["psycopg[binary]==3.2.10"]
fastdfs = ["fastdfs==0.2.1", "featuretools==1.31.0", "woodwork==0.31.0", "setuptools==80.9.0", "pyarrow==20.0.0", "sqlglot==27.28.1"]

[project.scripts]
ahead = "aheaddb.cli:main"
ahead-mcp = "aheaddb.mcp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
